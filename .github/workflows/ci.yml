name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Placeholders so the app builds without a real Convex deployment.
env:
  NEXT_PUBLIC_CONVEX_URL: https://ci-placeholder.convex.cloud
  NEXT_PUBLIC_APP_URL: https://testimony-io.vercel.app

# lint, typecheck, build, and test-plan start together. The test shards start
# as soon as test-plan (a few seconds) has picked the files and packed them.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec oxlint --format github
      - run: pnpm exec oxfmt --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # Typed routes come from Next's generated route types.
      - run: pnpm exec next typegen
      - run: bun check
      - run: bun check -p convex

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build

  test-plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      has-tests: ${{ steps.plan.outputs.has-tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          # `vitest --changed` needs the base branch to diff against.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: actions/cache/restore@v4
        with:
          path: .test-timings.json
          key: test-timings-${{ github.run_id }}
          restore-keys: test-timings-
      - id: plan
        env:
          # Pull requests run only the tests their diff can reach.
          CHANGED_SINCE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          if [ -n "$CHANGED_SINCE" ]; then
            plan=$(node scripts/test-shards.ts plan --changed "$CHANGED_SINCE")
          else
            plan=$(node scripts/test-shards.ts plan)
          fi
          echo "$plan"
          shards=$(echo "$plan" | jq -c '.shards')
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "has-tests=$([ "$shards" = "[]" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

  test:
    needs: test-plan
    if: needs.test-plan.outputs.has-tests == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.test-plan.outputs.shards) }}
    name: test (shard ${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: >-
          pnpm exec vitest run ${{ join(matrix.files, ' ') }}
          --reporter=default --reporter=github-actions
          --reporter=json --outputFile.json=reports/shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-${{ matrix.shard }}
          path: reports/
          retention-days: 7

  # On main, fold this run's per-file durations into the cached timings so the
  # next plan packs shards by real test time.
  record-test-timings:
    needs: test
    if: github.event_name == 'push' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: .test-timings.json
          key: test-timings-${{ github.run_id }}
          restore-keys: test-timings-
      - uses: actions/download-artifact@v4
        with:
          pattern: test-report-*
          path: reports
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/test-shards.ts record reports
      - uses: actions/cache/save@v4
        with:
          path: .test-timings.json
          key: test-timings-${{ github.run_id }}

  # The one check to mark as required: test shards change with every diff.
  ci:
    if: always()
    needs: [lint, typecheck, build, test-plan, test]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
